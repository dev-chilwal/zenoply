<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="12" fill="url(#accent)"/>

  <!-- Brand mark: rounded square with a check/tool glyph -->
  <g transform="translate(96, 150)">
    <rect width="92" height="92" rx="22" fill="url(#accent)"/>
    <path d="M26 48 l14 14 l26 -30" fill="none" stroke="#ffffff" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="208" y="218" font-family="Arial, Helvetica, sans-serif" font-size="68"
        font-weight="800" fill="#0f172a">Zenoply</text>

  <text x="98" y="330" font-family="Arial, Helvetica, sans-serif" font-size="58"
        font-weight="800" fill="#0f172a">Free tools that just work</text>

  <text x="98" y="398" font-family="Arial, Helvetica, sans-serif" font-size="30"
        font-weight="400" fill="#475569">Calculators, converters, image, PDF, text &amp; developer tools.</text>
  <text x="98" y="440" font-family="Arial, Helvetica, sans-serif" font-size="30"
        font-weight="400" fill="#475569">Fast, private, no signup.</text>

  <!-- Category chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600">
    <g transform="translate(98, 498)">
      <rect width="190" height="56" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <text x="95" y="37" text-anchor="middle" fill="#4f46e5">Finance</text>
    </g>
    <g transform="translate(304, 498)">
      <rect width="160" height="56" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <text x="80" y="37" text-anchor="middle" fill="#4f46e5">Image</text>
    </g>
    <g transform="translate(480, 498)">
      <rect width="150" height="56" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <text x="75" y="37" text-anchor="middle" fill="#4f46e5">Text</text>
    </g>
    <g transform="translate(646, 498)">
      <rect width="210" height="56" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <text x="105" y="37" text-anchor="middle" fill="#4f46e5">Developer</text>
    </g>
    <g transform="translate(872, 498)">
      <rect width="220" height="56" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <text x="110" y="37" text-anchor="middle" fill="#4f46e5">Converters</text>
    </g>
  </g>

  <text x="1102" y="218" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
        font-size="30" font-weight="700" fill="#818cf8">zenoply.com</text>
</svg>
